; Waveshare ESP32-S3-Knob-Touch-LCD-1.8 (S3 half). TaskActor fabric + reused UI.
[platformio]
default_envs = waveshare_knob_18_s3

[env:waveshare_knob_18_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
extra_scripts = pre:prepare_firmware.py
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSPINME_TA_DEVICE=1
  -I../../host
  -Iinclude
; Host TaskActor sources: symlinks under src/ta_host/ -> ../../../../host/*.c
; follow_glass / bench_probe are the retired uimk2 paint path (kept on disk
; for reference until removed; Draw owns the glass now).
build_src_filter = +<*> -<follow_glass.cpp> -<bench_probe.cpp>
monitor_speed = 115200
upload_speed = 115200
