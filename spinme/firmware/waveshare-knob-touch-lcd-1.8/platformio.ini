; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_knob_18_s3

[env:waveshare_knob_18_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
extra_scripts = pre:prepare_firmware.py
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<encoder_debug.cpp>
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
upload_speed = 115200

; Serial-only encoder trace. Does not build the panel, touch, or WiFi code.
[env:encoder_debug]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_src_filter = +<*> -<main.cpp> -<panel_init.cpp> -<panel_io.cpp> -<glyph_file.cpp> -<glyphs_embed.S>
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
upload_speed = 115200
