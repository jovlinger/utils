; Waveshare ESP32-S3-Knob-Touch-LCD-1.8 (S3 half). TaskActor fabric only.
[platformio]
default_envs = waveshare_knob_18_s3

[env:waveshare_knob_18_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
extra_scripts = pre:prepare_firmware.py
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSPINME_TA_DEVICE=1
  -Isrc/ta_host
  -Iinclude
; Host TaskActor sources: flat symlinks under src/ta_host/ ->
; ../../../../host/{event,shape,actor,base}/* (include path is src/ta_host).
; The old uimk2_host / Core-B paint path lives under retired/uimk2_paint/
; (outside src/ and include/, so it is never compiled). Draw owns the glass.
monitor_speed = 115200
upload_speed = 115200
